services:
  - type: web
    name: waraq-library-studio
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: python --version
    startCommand: python main.py
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    disk:
      name: waraq-library-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: LIBRARY_DB
        value: /var/data/library.db
      - key: WARAQ_DEMO_MODE
        value: "0"
      - key: WARAQ_COOKIE_SECURE
        value: "1"
      - key: WARAQ_ADMIN_USERNAME
        value: library-owner
      - key: WARAQ_ADMIN_PASSWORD
        sync: false
