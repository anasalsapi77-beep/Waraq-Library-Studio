services:
  - type: web
    name: waraq-library-studio
    runtime: python
    plan: free
    region: singapore
    buildCommand: python --version
    startCommand: python main.py
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.13
      - key: LIBRARY_DB
        value: /tmp/waraq/library.db
      - key: WARAQ_DEMO_MODE
        value: "0"
      - key: WARAQ_COOKIE_SECURE
        value: "1"
      - key: WARAQ_ADMIN_USERNAME
        value: library-owner
      - key: WARAQ_ADMIN_PASSWORD
        sync: false
